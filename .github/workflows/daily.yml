name: coin-daily

on:
  schedule:
    - cron: "30 0 * * *"        # 매일 00:30 UTC = 09:30 KST (GitHub 사정으로 10~30분 늦어질 수 있음)
  workflow_dispatch:             # Actions 탭의 "Run workflow" 버튼으로 수동 실행
    inputs:
      mode:
        description: "run = 정식 수집 / check = 점검만"
        required: true
        default: "run"
        type: choice
        options: [run, check]

permissions:
  contents: write

concurrency: coin-daily

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python coin_daily.py --check
          else
            python coin_daily.py
          fi

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')" || echo "변경 없음"
          git push
